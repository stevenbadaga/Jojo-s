<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/kitenge-logo.png.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/kitenge-logo.png.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/kitenge-logo.png.png" />
    <link rel="apple-touch-icon" href="/kitenge-logo.png.png" />
    <link rel="shortcut icon" href="/kitenge-logo.png.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <!-- Installed web app support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Primary Meta Tags -->
    <title>Esoko - Shop Fashion, Home, Beauty & More</title>
    <meta name="title" content="Esoko - Shop Fashion, Home, Beauty & More" />
    <meta name="description" content="Esoko is a modern online store for fashion, home, beauty, accessories, electronics, and everyday essentials in Rwanda." />
    <meta name="keywords" content="ecommerce rwanda, online shopping rwanda, fashion, home, beauty, accessories, electronics, marketplace" />
    <meta name="author" content="Esoko" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://esoko.com/" />
    <meta property="og:title" content="Esoko - Shop Fashion, Home, Beauty & More" />
    <meta property="og:description" content="Esoko is a modern online store for fashion, home, beauty, accessories, electronics, and everyday essentials in Rwanda." />
    <meta property="og:image" content="/og-image.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://esoko.com/" />
    <meta property="twitter:title" content="Esoko - Shop Fashion, Home, Beauty & More" />
    <meta property="twitter:description" content="Esoko is a modern online store for fashion, home, beauty, accessories, electronics, and everyday essentials in Rwanda." />
    <meta property="twitter:image" content="/og-image.jpg" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#ea580c" />
    <meta name="msapplication-TileColor" content="#ea580c" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
